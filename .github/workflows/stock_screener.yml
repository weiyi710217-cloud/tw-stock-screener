name: Intraday Stock Monitor

on:
  schedule:
    # 台灣時間 (UTC+8) 9:15 ~ 10:00，每 5 分鐘執行一次 (週一至週五)
    # 對應 UTC 時間為 1:15 ~ 2:00
    - cron: '15-59/5 1 * * 1-5'
    - cron: '0 2 * * 1-5'
  workflow_dispatch: # 支援手動觸發測試

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 💡 共用快取設定：與盤後選股共用 stock_cache，避免重複重抓
      - name: Cache stock data
        uses: actions/cache@v4
        with:
          path: stock_cache
          # key 可以保留用 run_id，這樣每次寫入時會有獨一無二的新快取
          key: stock-cache-${{ runner.os }}-${{ github.run_id }}
          # 核心關鍵：restore-keys 必須對齊你原本 Daily Stock Screener 的前綴
          restore-keys: |
            stock-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install pandas numpy requests yfinance

      - name: Run Intraday Check Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u script.py
