name: Daily Stock Screener & Deploy

on:
  schedule:
    # 台灣時間週一至週五 16:15 自動執行 (UTC 08:15)
    - cron: '15 8 * * 1-5'
  workflow_dispatch: # 支援手動一鍵點擊執行

env:
  FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出程式庫代碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 快取歷史行情
        uses: actions/cache@v4
        with:
          path: stock_cache
          key: stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stock-cache-${{ runner.os }}-

      - name: 5. 執行多策略選股
        run: |
         python -u script.py

      # 建立乾淨的發布資料夾，解決上傳過大導致卡住的問題
      - name: Prepare Pages Folder
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
